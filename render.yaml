databases:
  - name: campuscare-db
    databaseName: complaint_routing
    user: campuscare
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: campuscare-api
    runtime: docker
    branch: full-stack
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campuscare-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_COOKIE_SAMESITE
        value: Lax
      - key: FRONTEND_URL
        value: https://campuscare-frontend-hnh9.onrender.com
      - key: CORS_ORIGINS
        value: https://campuscare-frontend-hnh9.onrender.com
      - key: ENABLE_GEMINI
        value: "false"

  - type: web
    name: campuscare-frontend
    runtime: static
    branch: full-stack
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_HOST
        fromService:
          type: web
          name: campuscare-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
