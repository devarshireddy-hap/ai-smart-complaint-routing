databases:
  - name: campuscare-db
    databaseName: complaint_routing
    user: campuscare
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: campuscare-api
    runtime: docker
    branch: fullstack-2.0
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campuscare-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: JWT_COOKIE_SAMESITE
        value: Lax
      - key: FRONTEND_URL
        fromService:
          type: web
          name: campuscare-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: campuscare-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: ENABLE_GEMINI
        value: "false"
      - key: GOOGLE_REDIRECT_URI
        value: https://campuscare-api-dqr6.onrender.com/api/v1/auth/google/callback

  - type: web
    name: campuscare-frontend
    runtime: static
    branch: fullstack-2.0
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          type: web
          name: campuscare-api
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
