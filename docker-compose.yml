version: '3.8'

services:
  # PostgreSQL Database with pgvector
  postgres:
    image: pgvector/pgvector:pg15-latest
    container_name: complaint-routing-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-complaint_routing}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema/00_init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds/01_init_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - complaint-routing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-complaint_routing}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: complaint-routing-cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - complaint-routing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - with-cache

  # Flask Backend API
  backend:
    build:
      context: .
      dockerfile: ./docker/backend.Dockerfile
    container_name: complaint-routing-backend
    environment:
      FLASK_ENV: ${FLASK_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-complaint_routing}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./ai:/app/ai
      - ./logs:/app/logs
    networks:
      - complaint-routing-network
    command: flask run --host=0.0.0.0 --port=5000

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: complaint-routing-frontend
    environment:
      REACT_APP_API_BASE_URL: http://localhost:5000/api/v1
      REACT_APP_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
    networks:
      - complaint-routing-network
    stdin_open: true
    tty: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  complaint-routing-network:
    driver: bridge
